version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiscan-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONPATH=/app/backend
    volumes:
      - ./data:/app/backend/protected_storage
    restart: unless-stopped

